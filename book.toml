[book]
title = "trureturing — Discovering truth"
language = "en"
src = "src"

[output.html]
default-theme = "light"
site-url = "/trureturing-mdbook/"
# Thousands of pages: no "4.1.1.1." numbering, and the menu opens one level at a
# time (the current page's ancestors are opened for it).
no-section-label = true
# The toolbar's GitHub button opens the upstream repository; each page also links
# its own source file (scripts/render_page_sources.py).
git-repository-url = "https://github.com/the-omega-institute/trureturing"

# print.html repeats every chapter in one page (about 350 MB for the whole book):
# no browser can open it, and it alone pushed the Pages artifact past GitHub's 1 GB limit.
[output.html.print]
enable = false

[output.html.fold]
enable = true
level = 0

[output.html.search]
enable = false

[preprocessor.escape-pseudo-links]
command = "python3 scripts/escape_pseudo_links.py"
after = ["links"]
before = ["render-katex"]

# KaTeX under Node (scripts/katex_render.js, pinned by package-lock.json), not
# mdbook-katex: its QuickJS runtime overflows on deeply nested formulas.
[preprocessor.render-katex]
command = "python3 scripts/render_katex.py"
after = ["links", "escape-pseudo-links"]
