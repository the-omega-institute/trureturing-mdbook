name: Build and deploy Pages

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

# Builds and deployments are serialized per ref by job-level groups. A scheduled check
# that finds another run unfinished builds nothing rather than queueing behind it, where
# the next check would cancel it.

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      upstream_sha: ${{ steps.freshness.outputs.upstream_sha }}
      generator_revision: ${{ steps.freshness.outputs.generator_revision }}
      build_required: ${{ steps.freshness.outputs.build_required }}
    steps:
      - name: Check out site generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare captured upstream revision with deployed provenance
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$EVENT_NAME" != schedule ]]; then
            args+=(--force)
          else
            args+=(--skip-while-running)
          fi
          python3 scripts/site_freshness.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

  build:
    needs: probe
    if: needs.probe.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: github-pages-build-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
    env:
      UPSTREAM_SHA: ${{ needs.probe.outputs.upstream_sha }}
      GENERATOR_REVISION: ${{ needs.probe.outputs.generator_revision }}
    steps:
      - name: Check out site generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned KaTeX package
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(node -p 'require("katex/package.json").version')" = 0.16.4

      - name: Test site generator
        run: python3 -m unittest discover -s tests -v

      - name: Restore pinned site tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/trureturing-mdbook-tools
          key: site-tools-${{ runner.os }}-${{ runner.arch }}-mdbook-0.5.4-pagefind-1.5.2

      - name: Install pinned site tools on cache miss
        shell: bash
        run: |
          set -euo pipefail
          TOOL_ROOT="$RUNNER_TOOL_CACHE/trureturing-mdbook-tools"
          tools_ok=true
          test -x "$TOOL_ROOT/bin/mdbook" || tools_ok=false
          test -x "$TOOL_ROOT/bin/pagefind_extended" || tools_ok=false
          if [[ "$tools_ok" == true ]]; then
            [[ "$("$TOOL_ROOT/bin/mdbook" --version)" == "mdbook v0.5.4" ]] || tools_ok=false
            [[ "$("$TOOL_ROOT/bin/pagefind_extended" --version)" == "pagefind 1.5.2" ]] || tools_ok=false
          fi
          if [[ "$tools_ok" != true ]]; then
            rm -rf "$TOOL_ROOT"
            mkdir -p "$TOOL_ROOT/bin"

            curl --fail --location --retry 3 --silent --show-error \
              --output "$RUNNER_TEMP/mdbook.tar.gz" \
              https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
            echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $RUNNER_TEMP/mdbook.tar.gz" \
              | sha256sum --check --strict
            tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$TOOL_ROOT/bin"

            curl --fail --location --retry 3 --silent --show-error \
              --output "$RUNNER_TEMP/pagefind.tar.gz" \
              https://github.com/Pagefind/pagefind/releases/download/v1.5.2/pagefind_extended-v1.5.2-x86_64-unknown-linux-musl.tar.gz
            echo "aeb135927856e7a49816cf2c9c2e53167f87afa1f61f7288b7d66c234a950d38  $RUNNER_TEMP/pagefind.tar.gz" \
              | sha256sum --check --strict
            tar -xzf "$RUNNER_TEMP/pagefind.tar.gz" -C "$TOOL_ROOT/bin"
          fi
          "$TOOL_ROOT/bin/mdbook" --version
          "$TOOL_ROOT/bin/pagefind_extended" --version

          # Later steps call the pinned tools by name, so the tool directory
          # must be on PATH.
          echo "$TOOL_ROOT/bin" >> "$GITHUB_PATH"

      - name: Fetch captured upstream commit with full immutable history
        shell: bash
        run: |
          set -euo pipefail
          git init .upstream
          # Blobs outside the sparse checkout arrive one lazy fetch at a time; automatic
          # gc would repack the whole history in the background after each batch of them.
          git -C .upstream config gc.auto 0
          git -C .upstream config maintenance.auto false
          git -C .upstream remote add origin https://github.com/the-omega-institute/trureturing.git
          git -C .upstream fetch --filter=blob:none --no-tags origin "$UPSTREAM_SHA"
          git -C .upstream sparse-checkout init --cone
          # The open problems page reads frozen state files; checking them out fetches
          # their blobs in one request instead of one lazy fetch each.
          git -C .upstream sparse-checkout set Blueprint Problems Library Golden/Frozen/state
          git -C .upstream checkout --detach "$UPSTREAM_SHA"
          test "$(git -C .upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          test "$(git -C .upstream rev-parse --is-shallow-repository)" = false

      - name: Project upstream content
        run: |
          python3 -c 'import os; from scripts.site_freshness import generator_revision; assert generator_revision() == os.environ["GENERATOR_REVISION"]'
          python3 scripts/build-site.py .upstream "$RUNNER_TEMP/trureturing-mdbook-site-src" --upstream-sha "$UPSTREAM_SHA"

      - name: Build mdBook
        run: MDBOOK_BOOK__SRC="$RUNNER_TEMP/trureturing-mdbook-site-src" mdbook build --dest-dir book

      - name: Render immutable upstream source links
        run: python3 scripts/render_source_links.py .upstream "$RUNNER_TEMP/trureturing-mdbook-site-src" book

      - name: Link pages back to their upstream sources
        run: python3 scripts/render_page_sources.py .upstream "$RUNNER_TEMP/trureturing-mdbook-site-src" book

      - name: Compact the page template
        run: python3 scripts/compact_pages.py book

      - name: Extract native search labels
        run: python3 scripts/search_titles.py "$RUNNER_TEMP/trureturing-mdbook-site-src" book

      - name: Build Pagefind index
        run: pagefind_extended --site book --force-language zh

      - name: Verify release artifact
        run: python3 scripts/verify-site.py .upstream "$RUNNER_TEMP/trureturing-mdbook-site-src" book

      - name: Upload Pages artifact
        id: artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.build.outputs.artifact_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages-deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
