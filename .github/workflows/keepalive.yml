# GitHub may disable scheduled workflows after 60 days without repository activity.
# This bot-pushed empty commit is intended to reset that timer, but whether bot pushes
# count has not been verified; observe the scheduled workflow after roughly 60 days.
name: Keep scheduled workflows active

on:
  schedule:
    - cron: "7 4 5,20 * *"
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Push an empty activity commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows active"
          git push origin "HEAD:$DEFAULT_BRANCH"
